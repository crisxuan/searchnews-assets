<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1650" viewBox="0 0 1160 1650">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="#416d83"/></marker><marker id="side-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="#9a825c"/></marker></defs>
<rect width="1160" height="1650" rx="18" fill="#f5f7f9"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<text x="50" y="69" font-size="39" font-weight="650" fill="#243440">跟着一次请求，走过 Claude 的检查链路</text>
<text x="50" y="109" font-size="23" fill="#677683">示例：刚装好 Claude Code，输入「读一下 README.md」</text>
<rect x="50" y="150" width="700" height="120" rx="12" fill="white" stroke="#d5dfe5"/>
<rect x="50" y="150" width="7" height="120" rx="3" fill="#416d83"/>
<text x="74" y="188" font-size="25" font-weight="650" fill="#416d83">01</text>
<text x="122" y="188" font-size="29" font-weight="650" fill="#243440">启动并登录</text>
<text x="122" y="225" font-size="23" font-weight="400" fill="#566774">本地安装标识 / 当前会话</text>
<text x="122" y="257" font-size="23" font-weight="400" fill="#566774">OAuth 或 API Key / 账号与组织 / 套餐</text>
<path d="M400 270 V304" fill="none" stroke="#416d83" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="50" y="310" width="700" height="80" rx="12" fill="white" stroke="#d5dfe5"/>
<rect x="50" y="310" width="7" height="80" rx="3" fill="#416d83"/>
<text x="74" y="348" font-size="25" font-weight="650" fill="#416d83">02</text>
<text x="122" y="348" font-size="29" font-weight="650" fill="#243440">输入：读一下 README.md</text>
<text x="122" y="385" font-size="23" font-weight="400" fill="#566774">用户消息进入会话上下文</text>
<path d="M400 390 V424" fill="none" stroke="#416d83" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="50" y="430" width="700" height="180" rx="12" fill="white" stroke="#d5dfe5"/>
<rect x="50" y="430" width="7" height="180" rx="3" fill="#416d83"/>
<text x="74" y="468" font-size="25" font-weight="650" fill="#416d83">03</text>
<text x="122" y="468" font-size="29" font-weight="650" fill="#243440">组装模型请求</text>
<text x="122" y="505" font-size="23" font-weight="400" fill="#566774">正文：messages / system / tools</text>
<text x="122" y="537" font-size="23" font-weight="400" fill="#566774">关联：device_id / account_uuid / session_id</text>
<text x="122" y="569" font-size="23" font-weight="400" fill="#566774">来源：HTTP 客户端标记 / 正文归因文本</text>
<path d="M400 610 V644" fill="none" stroke="#416d83" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="50" y="650" width="700" height="120" rx="12" fill="white" stroke="#d5dfe5"/>
<rect x="50" y="650" width="7" height="120" rx="3" fill="#416d83"/>
<text x="74" y="688" font-size="25" font-weight="650" fill="#416d83">04</text>
<text x="122" y="688" font-size="29" font-weight="650" fill="#243440">HTTPS 发出请求</text>
<text x="122" y="725" font-size="23" font-weight="400" fill="#566774">客户端 → 网络入口 → API 服务</text>
<text x="122" y="757" font-size="23" font-weight="400" fill="#566774">网络来源可由接收方观察，和正文标识分开</text>
<path d="M400 770 V814" fill="none" stroke="#416d83" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="50" y="820" width="700" height="160" rx="12" fill="white" stroke="#d5dfe5"/>
<rect x="50" y="820" width="7" height="160" rx="3" fill="#4b7b66"/>
<text x="74" y="858" font-size="25" font-weight="650" fill="#4b7b66">05</text>
<text x="122" y="858" font-size="29" font-weight="650" fill="#243440">服务端接收与检查</text>
<text x="122" y="895" font-size="23" font-weight="400" fill="#566774">格式 / 凭证 / 权限 / 地区 / 额度</text>
<text x="122" y="927" font-size="23" font-weight="400" fill="#566774">这些是公开职责；内部执行顺序未公开</text>
<text x="122" y="959" font-size="23" font-weight="400" fill="#566774">任何一项拒绝，都需要看具体限制对象</text>
<path d="M400 980 V1024" fill="none" stroke="#416d83" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="50" y="1030" width="700" height="125" rx="12" fill="white" stroke="#d5dfe5"/>
<rect x="50" y="1030" width="7" height="125" rx="3" fill="#4b7b66"/>
<text x="74" y="1068" font-size="25" font-weight="650" fill="#4b7b66">06</text>
<text x="122" y="1068" font-size="29" font-weight="650" fill="#243440">内容处理与模型推理</text>
<text x="122" y="1105" font-size="23" font-weight="400" fill="#566774">官方披露：分类器可与对话处理并行</text>
<text x="122" y="1137" font-size="23" font-weight="400" fill="#566774">可能调整输出或停止响应</text>
<path d="M400 1155 V1199" fill="none" stroke="#416d83" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="50" y="1205" width="700" height="115" rx="12" fill="white" stroke="#d5dfe5"/>
<rect x="50" y="1205" width="7" height="115" rx="3" fill="#416d83"/>
<text x="74" y="1243" font-size="25" font-weight="650" fill="#416d83">07</text>
<text x="122" y="1243" font-size="29" font-weight="650" fill="#243440">接收响应</text>
<text x="122" y="1280" font-size="23" font-weight="400" fill="#566774">流式文字 / 工具调用 / API 错误</text>
<text x="122" y="1312" font-size="23" font-weight="400" fill="#566774">认证刷新、限流退避等按条件处理</text>
<path d="M400 1320 V1374" fill="none" stroke="#416d83" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="50" y="1380" width="700" height="130" rx="12" fill="white" stroke="#d5dfe5"/>
<rect x="50" y="1380" width="7" height="130" rx="3" fill="#416d83"/>
<text x="74" y="1418" font-size="25" font-weight="650" fill="#416d83">08</text>
<text x="122" y="1418" font-size="29" font-weight="650" fill="#243440">需要读文件时：本地工具循环</text>
<text x="122" y="1455" font-size="23" font-weight="400" fill="#566774">检查权限 → 执行读取 → 生成 tool_result</text>
<text x="122" y="1487" font-size="23" font-weight="400" fill="#566774">工具结果加入上下文，继续发起模型请求</text>
<path d="M50 1446 H23 V517 H47" fill="none" stroke="#416d83" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="810" y="185" width="300" height="200" rx="12" fill="#fffaf1" stroke="#ded3bd"/>
<text x="832" y="223" font-size="25" font-weight="650" fill="#7f6947">远程配置 · 条件启用</text>
<text x="832" y="263" font-size="21" font-weight="400" fill="#776c5a">账号 / 组织 / 套餐等属性</text>
<text x="832" y="295" font-size="21" font-weight="400" fill="#776c5a">→ 远程评估或本地缓存</text>
<text x="832" y="327" font-size="21" font-weight="400" fill="#776c5a">→ 功能资格与请求开关</text>
<text x="832" y="359" font-size="21" font-weight="400" fill="#776c5a">可在模型请求发出前生效</text>
<path d="M960 385 V574 H756" fill="none" stroke="#9a825c" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#side-arrow)"/>
<rect x="810" y="1040" width="300" height="245" rx="12" fill="#fffaf1" stroke="#ded3bd"/>
<text x="832" y="1078" font-size="25" font-weight="650" fill="#7f6947">事件连接 · 独立发送</text>
<text x="832" y="1118" font-size="21" font-weight="400" fill="#776c5a">请求 / 成功 / 失败等事件</text>
<text x="832" y="1150" font-size="21" font-weight="400" fill="#776c5a">附带身份、环境及耗时等</text>
<text x="832" y="1182" font-size="21" font-weight="400" fill="#776c5a">采集与采样开关影响发送</text>
<text x="832" y="1214" font-size="21" font-weight="400" fill="#776c5a">批量上报，时序不等同于</text>
<text x="832" y="1246" font-size="21" font-weight="400" fill="#776c5a">每一次模型请求的往返</text>
<path d="M750 712 H780 V1086 H804" fill="none" stroke="#9a825c" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#side-arrow)"/>
<path d="M750 1255 H804" fill="none" stroke="#9a825c" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#side-arrow)"/>
<rect x="810" y="1350" width="300" height="200" rx="12" fill="#fffaf1" stroke="#ded3bd"/>
<text x="832" y="1388" font-size="25" font-weight="650" fill="#7f6947">跨请求的持续调查</text>
<text x="832" y="1428" font-size="21" font-weight="400" fill="#776c5a">官方披露内容模式分析</text>
<text x="832" y="1460" font-size="21" font-weight="400" fill="#776c5a">及自动检测、人工复核</text>
<text x="832" y="1492" font-size="21" font-weight="400" fill="#776c5a">可能警告或终止账号</text>
<text x="832" y="1524" font-size="21" font-weight="400" fill="#776c5a">具体信号权重、阈值未公开</text>
<text x="50" y="1570" font-size="23" font-weight="400" fill="#526777">实线：模型请求与工具循环　　虚线：独立的配置、事件连接</text>
<text x="50" y="1611" font-size="22" font-weight="400" fill="#73818c">依据客户端源码与官方资料绘制。服务端部分展示职责，不代表内部调用图。</text>
</g></svg>